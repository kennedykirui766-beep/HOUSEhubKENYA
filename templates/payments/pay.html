{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
    
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h4 class="fw-bold mb-3 text-center">Secure Payment</h4>

        <p class="text-muted text-center mb-4">
            Complete your deposit payment
        </p>

        <div class="mb-3">
            <strong>Amount:</strong>
            <span class="text-success fw-bold">KES {{ link.amount }}</span>
        </div>

        <div class="mb-3">
            <strong>Status:</strong>
            <span class="badge bg-warning text-dark">{{ link.status }}</span>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Phone Number (M-Pesa)</label>
                <input type="text" name="phone" class="form-control" placeholder="e.g. 254712345678" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Pay Now
            </button>
        </form>
    </div>

</div>
{% endblock %}

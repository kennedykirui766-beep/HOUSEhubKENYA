{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            
            <!-- Failed Card -->
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    
                    <!-- Header Section -->
                    <div class="bg-danger text-white text-center p-5 pb-4">
                        <div class="mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-x-circle-fill" viewBox="0 0 16 16">
                                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                            </svg>
                        </div>
                        <h2 class="fw-bold">Payment Failed</h2>
                        <p class="opacity-75 mb-0">We could not process your transaction.</p>
                    </div>

                    <!-- Details Section -->
                    <div class="p-4 p-md-5">
                        
                        <div class="alert alert-danger d-flex align-items-center border-0 shadow-sm" role="alert">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
                                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                            </svg>
                            <div>
                                The payment was declined or the request timed out. Please try again or contact support.
                            </div>
                        </div>

                        <div class="text-center mb-5">
                            <p class="text-muted small text-uppercase fw-bold ls-1">Attempted Amount</p>
                            <h3 class="fw-bold text-dark mb-0">KES {{ "{:,.2f}".format(link.amount) }}</h3>
                        </div>

                        <div class="d-grid gap-2">
                            <!-- Try Again Link -->
                            <a href="{{ url_for('payments.pay', token=link.token) }}" class="btn btn-danger btn-lg rounded-3 fw-bold shadow-sm">
                                Try Again
                            </a>
                            
                            <a href="{{ url_for('tenant.dashboard') }}" class="btn btn-link text-muted text-decoration-none mt-2">
                                Return to Dashboard
                            </a>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

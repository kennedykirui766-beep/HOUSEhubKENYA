{% extends 'base.html' %}
{% block title %}{{ 'Edit Role' if role else 'Create Role' }}{% endblock %}
{% block content %}
<div class="content-card">
  <div class="content-card-header">
    <h3 class="content-card-title">{{ 'Edit Role' if role else 'Create Role' }}</h3>
  </div>
  <div class="content-card-body">
    <form method="POST" action="{% if role %}{{ url_for('admin.edit_role', role_id=role.id) }}{% else %}{{ url_for('admin.create_role') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ role.name if role else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <input name="description" class="form-control" value="{{ role.description if role else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Permissions</label>
        <div>
          {% for p in permissions %}
            <label class="me-2"><input type="checkbox" name="permissions" value="{{ p.id }}" {% if role and p in role.permissions %}checked{% endif %}> {{ p.name }}</label>
          {% else %}
            <p class="text-muted">No permissions configured yet.</p>
          {% endfor %}
        </div>
      </div>
      <button class="btn btn-primary">Save</button>
      <a href="{{ url_for('admin.roles') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

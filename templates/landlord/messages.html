{% extends "base.html" %}

{% block title %}Messages - HomeHub{% endblock %}

{% block styles %}
<style>
  /* --- 1. VARIABLES --- */
  :root {
    --wa-bg-app: #d1d7db;
    --wa-bg-sidebar: #ffffff;
    --wa-bg-chat: #efeae2;
    --wa-bg-header: #f0f2f5;
    --wa-primary: #00a884;
    --wa-bubble-out: #d9fdd3;
    --wa-bubble-in: #ffffff;
    --wa-text-primary: #111b21;
    --wa-text-secondary: #667781;
    --wa-border: #e9edef;
  }

  /* --- 2. CHAT CONTAINER --- */
  .chat-app-wrapper {
    display: flex;
    height: 85vh; /* Fixed height for desktop */
    min-height: 600px;
    background-color: var(--wa-bg-app);
    width: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: relative;
  }

  /* --- 3. LEFT SIDEBAR --- */
  .chat-sidebar {
    width: 30%;
    min-width: 300px;
    max-width: 400px;
    background-color: var(--wa-bg-sidebar);
    border-right: 1px solid var(--wa-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 10;
  }

  .sidebar-header {
    height: 60px;
    background-color: var(--wa-bg-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--wa-border);
    flex-shrink: 0;
  }

  .sidebar-title {
    font-weight: 600;
    color: var(--wa-text-primary);
  }

  .search-box {
    padding: 8px 12px;
    border-bottom: 1px solid var(--wa-border);
    background: #fff;
  }

  .search-wrapper {
    background-color: #f0f2f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 35px;
  }

  .search-icon {
    color: #54656f;
    margin-right: 10px;
    font-size: 0.9rem;
  }

  .search-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 0.9rem;
    outline: none;
    color: var(--wa-text-primary);
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
  }

  .chat-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid var(--wa-border);
    transition: background 0.2s;
  }

  .chat-item:hover { background-color: #f5f6f6; }
  .chat-item.active { background-color: #f0f2f5; }

  .avatar {
    width: 49px;
    height: 49px;
    border-radius: 50%;
    background-color: #dfe5e7;
    margin-right: 15px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .chat-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .info-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
  }

  .chat-name {
    font-weight: 500;
    color: var(--wa-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-time {
    font-size: 0.75rem;
    color: var(--wa-text-secondary);
  }

  .info-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--wa-text-secondary);
  }

  .last-msg {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- 4. RIGHT CHAT AREA --- */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: var(--wa-bg-chat);
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
    position: relative;
  }

  .chat-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    border-bottom: 6px solid #43c960;
    background: #f0f2f5;
  }

  .chat-view-header {
    height: 60px;
    padding: 0 16px;
    background-color: var(--wa-bg-header);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--wa-border);
    flex-shrink: 0;
  }

  .back-btn {
    display: none;
    border: none;
    background: none;
    color: var(--wa-text-secondary);
    font-size: 1.2rem;
    margin-right: 10px;
    cursor: pointer;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
  }

  .messages-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 5%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .msg-row {
    display: flex;
    margin-bottom: 10px;
    width: 100%;
  }

  .msg-row.sent { justify-content: flex-end; }
  .msg-row.received { justify-content: flex-start; }

  .bubble {
    max-width: 65%;
    padding: 6px 7px 8px 9px;
    border-radius: 7.5px;
    position: relative;
    font-size: 0.95rem;
    line-height: 1.4;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    word-wrap: break-word;
  }

  .bubble.sent {
    background-color: var(--wa-bubble-out);
    border-top-right-radius: 0;
  }

  .bubble.received {
    background-color: var(--wa-bubble-in);
    border-top-left-radius: 0;
  }

  .meta {
    float: right;
    margin-left: 10px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .time { font-size: 0.7rem; color: rgba(0,0,0,0.45); }
  .tick { font-size: 0.75rem; }

  .tick-blue { color: #53bdeb; }
  .tick-grey { color: #8696a0; }

  /* --- 5. INPUT AREA --- */
  .chat-input-footer {
    background-color: var(--wa-bg-header);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    z-index: 50;
    flex-shrink: 0;
  }

  .footer-icon {
    color: #54656f;
    font-size: 1.5rem;
    margin-right: 15px;
    cursor: pointer;
  }

  .input-wrapper {
    flex: 1;
    background-color: #fff;
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
  }

  .chat-text-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 0.95rem;
    background: transparent;
  }

  .send-btn {
    background: none;
    border: none;
    color: #54656f;
    font-size: 1.5rem;
    margin-left: 10px;
    cursor: pointer;
  }
  .send-btn:hover { color: var(--wa-primary); }

  /* --- 6. RESPONSIVE / MOBILE FIX --- */
  @media (max-width: 768px) {
    body.mobile-chat-open { overflow: hidden; }

    /* FIX: Hide the Global Support Chat Button on mobile to prevent collision */
    .chat-support-btn {
      display: none !important;
    }

    .chat-app-wrapper {
      /* FIXED: Start BELOW the navbar (64px is the navbar height) */
      top: var(--navbar-height); 
      bottom: 0; 
      left: 0; 
      right: 0;
      height: auto;
      
      border-radius: 0;
      position: fixed;
      /* Lower z-index slightly so it doesn't conflict with navbar, but still above content */
      z-index: 1030; 
    }

    .chat-sidebar {
      width: 100%;
      max-width: none;
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      z-index: 5;
    }

    .chat-main {
      width: 100%;
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.3s ease-in-out;
    }

    .chat-placeholder { display: none; }

    body.chat-active .chat-main {
      transform: translateX(0);
    }

    .back-btn { display: block; }

    .chat-input-footer {
      z-index: 100;
      padding: 10px 10px;
    }
  }

  ::-webkit-scrollbar { width: 6px !important; }
  ::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

</style>
{% endblock %}

{% block content %}
<!-- Data Injection -->
<script>
  window.rawMessages = {{ messages | tojson }};
  window.currentUser = {{ user | tojson }};
</script>

<!-- Main App Wrapper -->
<div class="chat-app-wrapper" id="chatWrapper">
  
  <!-- LEFT: Sidebar -->
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Chats</span>
      <div style="color: #54656f; display: flex; gap: 20px; font-size: 1.2rem;">
        <i class="fas fa-circle-notch"></i>
        <i class="fas fa-comment-alt"></i>
        <i class="fas fa-ellipsis-v"></i>
      </div>
    </div>

    <!-- Search Area (Flexbox Implementation) -->
    <div class="search-box">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search-input" placeholder="Search or start new chat" id="searchInput">
      </div>
    </div>

    <div class="chat-list" id="chatList">
      <!-- Filled by JS -->
    </div>
  </aside>

  <!-- RIGHT: Chat Area -->
  <main class="chat-main" id="chatMain">
    
    <!-- Desktop Placeholder -->
    <div class="chat-placeholder" id="chatPlaceholder">
      <i class="fas fa-comments" style="font-size: 5rem; color: #d1d7db; margin-bottom: 20px;"></i>
      <h2 style="color: #41525d; font-weight: 300;">HomeHub Web</h2>
      <p style="color: #667781;">Send and receive messages.</p>
    </div>

    <!-- Active Chat View -->
    <div id="activeChatView" style="display: none; height: 100%; flex-direction: column;">
      
      <header class="chat-view-header">
        <button class="back-btn" id="backBtn">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-avatar" id="headerAvatar"></div>
        <div style="flex: 1;">
          <div style="font-weight: 600; color: var(--wa-text-primary);" id="headerName">Name</div>
          <div style="font-size: 0.75rem; color: var(--wa-text-secondary);" id="headerStatus">online</div>
        </div>
        
        <!-- Sim Button -->
        <button id="simBtn" style="margin-left:auto; border:none; background:none; font-size:0.8rem; color:var(--wa-text-secondary); cursor:pointer;">
          Sim Online
        </button>

        <div style="color: #54656f; margin-left: 15px; display: flex; gap: 20px;">
          <i class="fas fa-search"></i>
          <i class="fas fa-ellipsis-v"></i>
        </div>
      </header>

      <div class="messages-scroll-area" id="messagesArea">
        <!-- Messages -->
      </div>

      <!-- INPUT AREA -->
      <footer class="chat-input-footer">
        <i class="far fa-smile footer-icon"></i>
        <i class="fas fa-plus footer-icon" style="font-size: 1.2rem;"></i>
        <div class="input-wrapper">
          <input type="text" class="chat-text-input" id="msgInput" placeholder="Type a message" autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </footer>

    </div>

  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // --- STATE ---
    const state = {
      currentUserId: window.currentUser.id,
      conversations: {},
      activeChatId: null,
      isRecipientOnline: false
    };

    // --- DOM ---
    const els = {
      wrapper: document.getElementById('chatWrapper'),
      list: document.getElementById('chatList'),
      search: document.getElementById('searchInput'),
      main: document.getElementById('chatMain'),
      placeholder: document.getElementById('chatPlaceholder'),
      activeView: document.getElementById('activeChatView'),
      headerName: document.getElementById('headerName'),
      headerAvatar: document.getElementById('headerAvatar'),
      headerStatus: document.getElementById('headerStatus'),
      messagesArea: document.getElementById('messagesArea'),
      input: document.getElementById('msgInput'),
      sendBtn: document.getElementById('sendBtn'),
      backBtn: document.getElementById('backBtn'),
      simBtn: document.getElementById('simBtn'),
      body: document.body
    };

    // --- PROCESS DATA ---
    function processData() {
      window.rawMessages.forEach(msg => {
        const isMe = msg.sender_id === state.currentUserId;
        const otherId = isMe ? msg.receiver_id : msg.sender_id;
        const otherInfo = msg.other_user;

        if (!state.conversations[otherId]) {
          state.conversations[otherId] = {
            id: otherId,
            name: otherInfo.name,
            avatar: otherInfo.avatar,
            messages: [],
            lastMsgTime: msg.timestamp
          };
        }

        if (typeof msg.is_read === 'undefined') msg.is_read = false;
        state.conversations[otherId].messages.push(msg);

        if (new Date(msg.timestamp) > new Date(state.conversations[otherId].lastMsgTime)) {
          state.conversations[otherId].lastMsgTime = msg.timestamp;
        }
      });
    }

    // --- TICK LOGIC ---
    function getTickHtml(msg, isOnline) {
      if (msg.is_read) return '<i class="fas fa-check-double tick tick-blue"></i>';
      if (isOnline) return '<i class="fas fa-check-double tick tick-grey"></i>';
      return '<i class="fas fa-check tick tick-grey"></i>';
    }

    // --- RENDER LIST ---
    function renderList() {
      els.list.innerHTML = '';
      const sorted = Object.values(state.conversations).sort((a, b) => new Date(b.lastMsgTime) - new Date(a.lastMsgTime));

      if (sorted.length === 0) {
        els.list.innerHTML = '<div style="padding:20px; text-align:center; color:#667781;">No messages.</div>';
        return;
      }

      sorted.forEach(convo => {
        const lastMsg = convo.messages[convo.messages.length - 1];
        const div = document.createElement('div');
        div.className = `chat-item ${state.activeChatId === convo.id ? 'active' : ''}`;
        div.onclick = () => loadChat(convo.id);

        const initials = convo.name ? convo.name.charAt(0).toUpperCase() : '?';
        const avatarHtml = convo.avatar ? `<img src="${convo.avatar}">` : `<span>${initials}</span>`;
        
        const timeStr = new Date(lastMsg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        const isOnline = (state.activeChatId === convo.id) ? state.isRecipientOnline : false;
        const tickHtml = (lastMsg.sender_id === state.currentUserId) ? getTickHtml(lastMsg, isOnline) : '';

        div.innerHTML = `
          <div class="avatar">${avatarHtml}</div>
          <div class="chat-info">
            <div class="info-top">
              <span class="chat-name" title="${convo.name}">${convo.name}</span>
              <span class="chat-time">${timeStr}</span>
            </div>
            <div class="info-bottom">
              <span style="margin-right:3px">${tickHtml}</span>
              <span class="last-msg">${lastMsg.content}</span>
            </div>
          </div>
        `;
        els.list.appendChild(div);
      });
    }

    // --- LOAD CHAT ---
    function loadChat(id) {
      state.activeChatId = id;
      const convo = state.conversations[id];
      state.isRecipientOnline = false;
      updateStatusUI();

      renderList();
      els.placeholder.style.display = 'none';
      els.activeView.style.display = 'flex';
      els.body.classList.add('chat-active');
      els.body.classList.add('mobile-chat-open');

      els.headerName.textContent = convo.name;
      const initials = convo.name.substring(0,2).toUpperCase();
      els.headerAvatar.innerHTML = convo.avatar 
        ? `<img src="${convo.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`
        : `<div style="width:100%; height:100%; background:#00a884; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white;">${initials}</div>`;

      renderMessages(convo.messages);
    }

    function renderMessages(messages) {
      els.messagesArea.innerHTML = '';
      messages.forEach(msg => renderBubble(msg));
      els.messagesArea.scrollTop = els.messagesArea.scrollHeight;
    }

    function renderBubble(msg) {
      const isMe = msg.sender_id === state.currentUserId;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'sent' : 'received'}`;
      
      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      let tickHtml = '';
      if (isMe) tickHtml = getTickHtml(msg, state.isRecipientOnline);

      row.innerHTML = `
        <div class="bubble">
          ${msg.content}
          <div class="meta">
            <span class="time">${timeStr}</span>
            ${tickHtml}
          </div>
        </div>
      `;
      els.messagesArea.appendChild(row);
    }

    // --- SEND ---
    function sendMessage() {
      const text = els.input.value.trim();
      if (!text || !state.activeChatId) return;

      const tempMsg = {
        id: Date.now(),
        sender_id: state.currentUserId,
        receiver_id: state.activeChatId,
        content: text,
        timestamp: new Date().toISOString(),
        is_read: false,
        other_user: state.conversations[state.activeChatId]
      };

      state.conversations[state.activeChatId].messages.push(tempMsg);
      renderBubble(tempMsg);
      els.input.value = '';
      els.messagesArea.scrollTop = els.messagesArea.scrollHeight;
      renderList();

      fetch(window.location.href, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken()},
        body: JSON.stringify({ content: text, receiver_id: state.activeChatId })
      })
      .then(res => res.json())
      .then(data => { if(!data.success) alert("Failed"); })
      .catch(e => console.error(e));
    }

    function updateStatusUI() {
      if (state.isRecipientOnline) {
        els.headerStatus.textContent = "online";
        els.headerStatus.style.color = "var(--wa-primary)";
        els.simBtn.textContent = "Go Offline";
        els.simBtn.style.color = "var(--wa-primary)";
      } else {
        els.headerStatus.textContent = "offline";
        els.headerStatus.style.color = "var(--wa-text-secondary)";
        els.simBtn.textContent = "Go Online";
        els.simBtn.style.color = "var(--wa-text-secondary)";
      }
      if (state.activeChatId) {
        renderMessages(state.conversations[state.activeChatId].messages);
        renderList();
      }
    }

    function getCSRFToken() {
      return document.querySelector('meta[name="csrf-token"]')?.content || '';
    }

    // --- EVENTS ---
    els.sendBtn.addEventListener('click', sendMessage);
    els.input.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
    
    els.backBtn.addEventListener('click', () => {
      els.body.classList.remove('chat-active');
      els.body.classList.remove('mobile-chat-open');
      state.activeChatId = null;
      setTimeout(() => {
        els.activeView.style.display = 'none';
        els.placeholder.style.display = 'flex';
        renderList();
      }, 300);
    });

    els.search.addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      const items = els.list.querySelectorAll('.chat-item');
      items.forEach(item => {
        const name = item.querySelector('.chat-name').textContent.toLowerCase();
        item.style.display = name.includes(term) ? 'flex' : 'none';
      });
    });

    els.simBtn.addEventListener('click', () => {
      state.isRecipientOnline = !state.isRecipientOnline;
      updateStatusUI();
    });

    processData();
    renderList();
  });
</script>
{% endblock %}

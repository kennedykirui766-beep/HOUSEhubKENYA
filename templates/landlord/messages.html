{% extends "base.html" %}

{% block title %}Messages - HomeHub{% endblock %}

{% block styles %}
<style>
  /* --- 1. VARIABLES --- */
  :root {
    --wa-bg-app: #d1d7db;
    --wa-bg-sidebar: #ffffff;
    --wa-bg-chat: #efeae2;
    --wa-bg-header: #f0f2f5;
    --wa-primary: #00a884;
    --wa-bubble-out: #d9fdd3;
    --wa-bubble-in: #ffffff;
    --wa-text-primary: #111b21;
    --wa-text-secondary: #667781;
    --wa-border: #e9edef;
  }

  /* --- 2. CHAT CONTAINER --- */
  .chat-app-wrapper {
    display: flex;
    height: 85vh;
    min-height: 600px;
    background-color: var(--wa-bg-app);
    width: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: relative;
  }

  /* --- 3. LEFT SIDEBAR --- */
  .chat-sidebar {
    width: 30%;
    min-width: 300px;
    max-width: 400px;
    background-color: var(--wa-bg-sidebar);
    border-right: 1px solid var(--wa-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 10;
  }

  .sidebar-header {
    height: 60px;
    background-color: var(--wa-bg-header);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--wa-border);
    flex-shrink: 0;
  }

  .sidebar-title {
    font-weight: 600;
    color: var(--wa-text-primary);
  }

  .search-box {
    padding: 8px 12px;
    border-bottom: 1px solid var(--wa-border);
    background: #fff;
  }

  .search-wrapper {
    background-color: #f0f2f5;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    height: 35px;
  }

  .search-icon {
    color: #54656f;
    margin-right: 10px;
    font-size: 0.9rem;
  }

  .search-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 0.9rem;
    outline: none;
    color: var(--wa-text-primary);
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
  }

  .chat-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid var(--wa-border);
    transition: background 0.2s;
  }

  .chat-item:hover { background-color: #f5f6f6; }
  .chat-item.active { background-color: #f0f2f5; }

  .avatar {
    width: 49px;
    height: 49px;
    border-radius: 50%;
    background-color: #dfe5e7;
    margin-right: 15px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    overflow: hidden;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* Presence dot on avatar */
  .presence-dot {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: #9aa5ac;
  }
  .presence-dot.online { background: #25d366; }

  .chat-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .info-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
  }

  .chat-name {
    font-weight: 500;
    color: var(--wa-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-time {
    font-size: 0.75rem;
    color: var(--wa-text-secondary);
  }

  .info-bottom {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--wa-text-secondary);
  }

  .last-msg {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- 4. RIGHT CHAT AREA --- */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: var(--wa-bg-chat);
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%239C92AC' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E");
    position: relative;
  }

  .chat-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    border-bottom: 6px solid #43c960;
    background: #f0f2f5;
  }

  .chat-view-header {
    height: 60px;
    padding: 0 16px;
    background-color: var(--wa-bg-header);
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--wa-border);
    flex-shrink: 0;
  }

  .back-btn {
    display: none;
    border: none;
    background: none;
    color: var(--wa-text-secondary);
    font-size: 1.2rem;
    margin-right: 10px;
    cursor: pointer;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 10px;
    position: relative;
    flex-shrink: 0;
  }

  .messages-scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 5%;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* --- Date Separator (WhatsApp style) --- */
  .date-separator {
    align-self: center;
    background: #ffffff;
    color: #54656f;
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 7px;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    margin: 10px 0;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .msg-row {
    display: flex;
    margin-bottom: 10px;
    width: 100%;
  }

  .msg-row.sent { justify-content: flex-end; }
  .msg-row.received { justify-content: flex-start; }

  .bubble {
    max-width: 65%;
    padding: 6px 7px 8px 9px;
    border-radius: 7.5px;
    position: relative;
    font-size: 0.95rem;
    line-height: 1.4;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    word-wrap: break-word;
  }

  .bubble.sent {
    background-color: var(--wa-bubble-out);
    border-top-right-radius: 0;
  }

  .bubble.received {
    background-color: var(--wa-bubble-in);
    border-top-left-radius: 0;
  }

  .meta {
    float: right;
    margin-left: 10px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .time { font-size: 0.7rem; color: rgba(0,0,0,0.45); }
  .tick { font-size: 0.75rem; }

  .tick-blue { color: #53bdeb; }
  .tick-grey { color: #8696a0; }

  /* --- 5. INPUT AREA --- */
  .chat-input-footer {
    background-color: var(--wa-bg-header);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    z-index: 50;
    flex-shrink: 0;
    position: relative;
  }

  .footer-icon {
    color: #54656f;
    font-size: 1.5rem;
    margin-right: 15px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: color 0.15s;
  }
  .footer-icon:hover { color: var(--wa-primary); }

  .input-wrapper {
    flex: 1;
    background-color: #fff;
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    align-items: center;
  }

  .chat-text-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 0.95rem;
    background: transparent;
  }

  .send-btn {
    background: none;
    border: none;
    color: #54656f;
    font-size: 1.5rem;
    margin-left: 10px;
    cursor: pointer;
  }
  .send-btn:hover { color: var(--wa-primary); }

  /* --- Emoji picker --- */
  .emoji-picker {
    position: absolute;
    bottom: 70px;
    left: 16px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    padding: 10px;
    display: none;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    width: 320px;
    z-index: 200;
  }
  .emoji-picker.open { display: grid; }
  .emoji-picker button {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: background 0.12s;
  }
  .emoji-picker button:hover { background: #f0f2f5; }

  /* --- Attachment menu --- */
  .attach-menu {
    position: absolute;
    bottom: 70px;
    left: 60px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 4px;
    z-index: 200;
    min-width: 180px;
  }
  .attach-menu.open { display: flex; }
  .attach-menu button {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--wa-text-primary);
    text-align: left;
  }
  .attach-menu button:hover { background: #f0f2f5; }
  .attach-menu button i { color: var(--wa-primary); width: 20px; text-align: center; }

  /* --- 6. RESPONSIVE / MOBILE FIX --- */
  @media (max-width: 768px) {
    body.mobile-chat-open { overflow: hidden; }

    .chat-support-btn { display: none !important; }

    .chat-app-wrapper {
      top: var(--navbar-height);
      bottom: 0;
      left: 0;
      right: 0;
      height: auto;
      border-radius: 0;
      position: fixed;
      z-index: 1030;
    }

    .chat-sidebar {
      width: 100%;
      max-width: none;
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      z-index: 5;
    }

    .chat-main {
      width: 100%;
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.3s ease-in-out;
    }

    .chat-placeholder { display: none; }

    body.chat-active .chat-main { transform: translateX(0); }

    .back-btn { display: block; }

    .chat-input-footer { z-index: 100; padding: 10px 10px; }

    .emoji-picker { width: calc(100vw - 32px); left: 16px; grid-template-columns: repeat(8, 1fr); }
    .attach-menu { left: 50px; }
  }

  ::-webkit-scrollbar { width: 6px !important; }
  ::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }
</style>
{% endblock %}

{% block content %}
<!-- Data Injection -->
<script>
  window.rawMessages = {{ messages | tojson }};
  window.currentUser = {{ user | tojson }};
</script>

<!-- Main App Wrapper -->
<div class="chat-app-wrapper" id="chatWrapper">

  <!-- LEFT: Sidebar -->
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Chats</span>
      <div style="color: #54656f; display: flex; gap: 20px; font-size: 1.2rem;">
        <i class="fas fa-circle-notch"></i>
        <i class="fas fa-comment-alt"></i>
        <i class="fas fa-ellipsis-v"></i>
      </div>
    </div>

    <div class="search-box">
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="search-input" placeholder="Search or start new chat" id="searchInput">
      </div>
    </div>

    <div class="chat-list" id="chatList">
      <!-- Filled by JS -->
    </div>
  </aside>

  <!-- RIGHT: Chat Area -->
  <main class="chat-main" id="chatMain">

    <!-- Desktop Placeholder -->
    <div class="chat-placeholder" id="chatPlaceholder">
      <i class="fas fa-comments" style="font-size: 5rem; color: #d1d7db; margin-bottom: 20px;"></i>
      <h2 style="color: #41525d; font-weight: 300;">HomeHub Web</h2>
      <p style="color: #667781;">Send and receive messages.</p>
    </div>

    <!-- Active Chat View -->
    <div id="activeChatView" style="display: none; height: 100%; flex-direction: column;">

      <header class="chat-view-header">
        <button class="back-btn" id="backBtn">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="header-avatar" id="headerAvatar"></div>
        <div style="flex: 1;">
          <div style="font-weight: 600; color: var(--wa-text-primary);" id="headerName">Name</div>
          <div style="font-size: 0.75rem; color: var(--wa-text-secondary);" id="headerStatus">offline</div>
        </div>

        <div style="color: #54656f; margin-left: 15px; display: flex; gap: 20px;">
          <i class="fas fa-search"></i>
          <i class="fas fa-ellipsis-v"></i>
        </div>
      </header>

      <div class="messages-scroll-area" id="messagesArea">
        <!-- Messages -->
      </div>

      <!-- INPUT AREA -->
      <footer class="chat-input-footer">
        <!-- Emoji button + picker -->
        <button type="button" class="footer-icon" id="emojiBtn" title="Emoji">
          <i class="far fa-smile"></i>
        </button>
        <div class="emoji-picker" id="emojiPicker"></div>

        <!-- Attachment button + menu -->
        <button type="button" class="footer-icon" id="attachBtn" title="Attach">
          <i class="fas fa-plus"></i>
        </button>
        <div class="attach-menu" id="attachMenu">
          <button type="button" data-type="image"><i class="fas fa-image"></i> Photo</button>
          <button type="button" data-type="document"><i class="fas fa-file-alt"></i> Document</button>
          <button type="button" data-type="location"><i class="fas fa-map-marker-alt"></i> Location</button>
        </div>

        <div class="input-wrapper">
          <input type="text" class="chat-text-input" id="msgInput" placeholder="Type a message" autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </footer>

    </div>

  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {

    // =====================================================================
    // STATE
    // =====================================================================
    const state = {
      currentUserId: window.currentUser.id,
      conversations: {},
      activeChatId: null,
      isRecipientOnline: false,

      // Presence map: { userId: true/false }
      presence: {},

      // Smart polling state
      lastKnownUnreadCount: null,
      lastMessageTimestamp: null,
      pollInterval: null,
      POLL_ACTIVE_MS: 4000,
      POLL_IDLE_MS: 15000,
    };

    // =====================================================================
    // DOM
    // =====================================================================
    const els = {
      wrapper: document.getElementById('chatWrapper'),
      list: document.getElementById('chatList'),
      search: document.getElementById('searchInput'),
      main: document.getElementById('chatMain'),
      placeholder: document.getElementById('chatPlaceholder'),
      activeView: document.getElementById('activeChatView'),
      headerName: document.getElementById('headerName'),
      headerAvatar: document.getElementById('headerAvatar'),
      headerStatus: document.getElementById('headerStatus'),
      messagesArea: document.getElementById('messagesArea'),
      input: document.getElementById('msgInput'),
      sendBtn: document.getElementById('sendBtn'),
      backBtn: document.getElementById('backBtn'),
      body: document.body,
      emojiBtn: document.getElementById('emojiBtn'),
      emojiPicker: document.getElementById('emojiPicker'),
      attachBtn: document.getElementById('attachBtn'),
      attachMenu: document.getElementById('attachMenu'),
    };

    // =====================================================================
    // DATE HELPERS
    // =====================================================================
    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function formatDateSeparator(isoStr) {
      const d = new Date(isoStr);
      const now = new Date();
      const yesterday = new Date();
      yesterday.setDate(now.getDate() - 1);

      if (isSameDay(d, now)) return 'Today';
      if (isSameDay(d, yesterday)) return 'Yesterday';

      // Within the last 7 days → weekday name
      const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays < 7) {
        return d.toLocaleDateString(undefined, { weekday: 'long' });
      }
      // Older → date string
      return d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    // =====================================================================
    // PROCESS INITIAL DATA
    // =====================================================================
    function processData(messages) {
      messages.forEach(msg => {
        const isMe = msg.sender_id === state.currentUserId;
        const otherId = isMe ? msg.receiver_id : msg.sender_id;
        const otherInfo = msg.other_user;

        if (!state.conversations[otherId]) {
          state.conversations[otherId] = {
            id: otherId,
            name: otherInfo.name,
            avatar: otherInfo.avatar,
            messages: [],
            lastMsgTime: msg.timestamp
          };
        }

        if (typeof msg.is_read === 'undefined') msg.is_read = false;

        const alreadyExists = state.conversations[otherId].messages.some(m => m.id === msg.id);
        if (!alreadyExists) {
          state.conversations[otherId].messages.push(msg);
        }

        if (new Date(msg.timestamp) > new Date(state.conversations[otherId].lastMsgTime)) {
          state.conversations[otherId].lastMsgTime = msg.timestamp;
        }

        if (
          !state.lastMessageTimestamp ||
          new Date(msg.timestamp) > new Date(state.lastMessageTimestamp)
        ) {
          state.lastMessageTimestamp = msg.timestamp;
        }
      });
    }

    // =====================================================================
    // TICK LOGIC
    // =====================================================================
    function getTickHtml(msg, isOnline) {
      if (msg.is_read) return '<i class="fas fa-check-double tick tick-blue"></i>';
      if (isOnline)    return '<i class="fas fa-check-double tick tick-grey"></i>';
      return '<i class="fas fa-check tick tick-grey"></i>';
    }

    // =====================================================================
    // RENDER LIST
    // =====================================================================
    function renderList() {
      els.list.innerHTML = '';
      const sorted = Object.values(state.conversations)
        .sort((a, b) => new Date(b.lastMsgTime) - new Date(a.lastMsgTime));

      if (sorted.length === 0) {
        els.list.innerHTML = '<div style="padding:20px; text-align:center; color:#667781;">No messages.</div>';
        return;
      }

      sorted.forEach(convo => {
        const lastMsg = convo.messages[convo.messages.length - 1];
        const div = document.createElement('div');
        div.className = `chat-item ${state.activeChatId === convo.id ? 'active' : ''}`;
        div.onclick = () => loadChat(convo.id);

        const initials = convo.name ? convo.name.charAt(0).toUpperCase() : '?';
        const avatarHtml = convo.avatar ? `<img src="${convo.avatar}">` : `<span>${initials}</span>`;

        // Presence dot
        const online = !!state.presence[convo.id];
        const presenceHtml = `<span class="presence-dot ${online ? 'online' : ''}"></span>`;

        // Last message time → human-friendly
        const lastMsgDate = new Date(lastMsg.timestamp);
        const now = new Date();
        let timeStr;
        if (isSameDay(lastMsgDate, now)) {
          timeStr = lastMsgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (isSameDay(lastMsgDate, new Date(now.getTime() - 86400000))) {
          timeStr = 'Yesterday';
        } else {
          timeStr = lastMsgDate.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit' });
        }

        const tickHtml = (lastMsg.sender_id === state.currentUserId)
          ? getTickHtml(lastMsg, online)
          : '';

        div.innerHTML = `
          <div class="avatar">${avatarHtml}${presenceHtml}</div>
          <div class="chat-info">
            <div class="info-top">
              <span class="chat-name" title="${convo.name}">${convo.name}</span>
              <span class="chat-time">${timeStr}</span>
            </div>
            <div class="info-bottom">
              <span style="margin-right:3px">${tickHtml}</span>
              <span class="last-msg">${lastMsg.content}</span>
            </div>
          </div>
        `;
        els.list.appendChild(div);
      });
    }

    // =====================================================================
    // LOAD CHAT
    // =====================================================================
    function loadChat(id) {
      state.activeChatId = id;
      const convo = state.conversations[id];
      updateStatusUI();

      renderList();
      els.placeholder.style.display = 'none';
      els.activeView.style.display = 'flex';
      els.body.classList.add('chat-active');
      els.body.classList.add('mobile-chat-open');

      els.headerName.textContent = convo.name;
      const initials = convo.name.substring(0, 2).toUpperCase();
      els.headerAvatar.innerHTML = convo.avatar
        ? `<img src="${convo.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`
        : `<div style="width:100%; height:100%; background:#00a884; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white;">${initials}</div>`;

      renderMessages(convo.messages);
      restartPolling(state.POLL_ACTIVE_MS);
    }

    function renderMessages(messages) {
      els.messagesArea.innerHTML = '';

      let lastDay = null;
      messages.forEach(msg => {
        const msgDate = new Date(msg.timestamp);

        // Insert date separator when the day changes
        if (!lastDay || !isSameDay(lastDay, msgDate)) {
          const sep = document.createElement('div');
          sep.className = 'date-separator';
          sep.textContent = formatDateSeparator(msg.timestamp);
          els.messagesArea.appendChild(sep);
          lastDay = msgDate;
        }

        renderBubble(msg);
      });

      els.messagesArea.scrollTop = els.messagesArea.scrollHeight;
    }

    function renderBubble(msg) {
      const isMe = msg.sender_id === state.currentUserId;
      const row = document.createElement('div');
      row.className = `msg-row ${isMe ? 'sent' : 'received'}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let tickHtml = '';
      if (isMe) tickHtml = getTickHtml(msg, state.isRecipientOnline);

      // Escape content to prevent HTML injection
      const safeContent = escapeHtml(msg.content);

      row.innerHTML = `
        <div class="bubble">
          ${safeContent}
          <div class="meta">
            <span class="time">${timeStr}</span>
            ${tickHtml}
          </div>
        </div>
      `;
      els.messagesArea.appendChild(row);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\n/g, '<br>');
    }

    // =====================================================================
    // SEND MESSAGE
    // =====================================================================
    function sendMessage() {
      const text = els.input.value.trim();
      if (!text || !state.activeChatId) return;

      const tempMsg = {
        id: Date.now(),
        sender_id: state.currentUserId,
        receiver_id: state.activeChatId,
        content: text,
        timestamp: new Date().toISOString(),
        is_read: false,
        other_user: state.conversations[state.activeChatId]
      };

      state.conversations[state.activeChatId].messages.push(tempMsg);
      renderMessages(state.conversations[state.activeChatId].messages);
      els.input.value = '';
      els.messagesArea.scrollTop = els.messagesArea.scrollHeight;
      renderList();

      fetch('/landlord/send_message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
        body: JSON.stringify({ content: text, receiver_id: state.activeChatId })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.message) {
          const realMsg = data.message;
          const convo = state.conversations[state.activeChatId];
          const tempMsgIndex = convo.messages.length - 1;
          if (convo.messages[tempMsgIndex].id === tempMsg.id) {
            convo.messages[tempMsgIndex] = realMsg;
            if (
              !state.lastMessageTimestamp ||
              new Date(realMsg.timestamp) > new Date(state.lastMessageTimestamp)
            ) {
              state.lastMessageTimestamp = realMsg.timestamp;
            }
            renderMessages(convo.messages);
            renderList();
          }
        } else {
          alert(data.error || "Failed to send message");
        }
      })
      .catch(e => console.error(e));
    }

    // =====================================================================
    // STATUS UI (uses real presence from server)
    // =====================================================================
    function updateStatusUI() {
      const online = state.activeChatId ? !!state.presence[state.activeChatId] : false;
      state.isRecipientOnline = online;

      if (online) {
        els.headerStatus.textContent = "online";
        els.headerStatus.style.color = "var(--wa-primary)";
      } else {
        els.headerStatus.textContent = "offline";
        els.headerStatus.style.color = "var(--wa-text-secondary)";
      }

      if (state.activeChatId) {
        renderMessages(state.conversations[state.activeChatId].messages);
        renderList();
      }
    }

    function getCSRFToken() {
      return document.querySelector('meta[name="csrf-token"]')?.content || '';
    }

    // =====================================================================
    // SMART POLLING (now also updates presence)
    // =====================================================================
    function poll() {
      let url = '/landlord/poll_messages';
      if (state.lastMessageTimestamp) {
        url += '?since=' + encodeURIComponent(state.lastMessageTimestamp);
      }

      fetch(url, {
        method: 'GET',
        headers: { 'X-CSRFToken': getCSRFToken() }
      })
      .then(res => {
        if (!res.ok) throw new Error('Poll failed: ' + res.status);
        return res.json();
      })
      .then(data => {
        // --- Presence update ---
        if (data.presence && typeof data.presence === 'object') {
          const changed = Object.keys(data.presence).some(
            uid => state.presence[uid] !== data.presence[uid]
          );
          state.presence = data.presence;
          if (changed) {
            updateStatusUI();
            renderList();
          }
        }

        const newUnreadCount = data.unread_count ?? 0;
        const chatIsOpen     = state.activeChatId !== null;
        const unreadChanged  = state.lastKnownUnreadCount !== null &&
                               newUnreadCount !== state.lastKnownUnreadCount;

        state.lastKnownUnreadCount = newUnreadCount;

        if (!chatIsOpen && !unreadChanged) {
          return;
        }

        if (data.messages && data.messages.length > 0) {
          processData(data.messages);

          if (chatIsOpen) {
            const convo = state.conversations[state.activeChatId];
            if (convo) {
              const wasAtBottom = isScrolledToBottom(els.messagesArea);
              renderMessages(convo.messages);
              if (wasAtBottom) {
                els.messagesArea.scrollTop = els.messagesArea.scrollHeight;
              }
            }
          }

          renderList();
        }
      })
      .catch(err => {
        console.warn('[Poll]', err.message);
      });
    }

    function isScrolledToBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    }

    function restartPolling(intervalMs) {
      if (state.pollInterval) {
        clearInterval(state.pollInterval);
      }
      state.pollInterval = setInterval(poll, intervalMs);
    }

    // =====================================================================
    // EMOJI PICKER
    // =====================================================================
    const EMOJIS = [
      '😀','😃','😄','😁','😆','😅','😂','🤣',
      '😊','😇','🙂','🙃','😉','😌','😍','🥰',
      '😘','😗','😙','😚','😋','😛','😝','😜',
      '🤪','🤨','🧐','🤓','😎','🤩','🥳','😏',
      '😒','😞','😔','😟','😕','🙁','☹️','😣',
      '😖','😫','😩','🥺','😢','😭','😤','😠',
      '😡','🤬','🤯','😳','🥵','🥶','😱','😨',
      '😰','😥','😓','🤗','🤔','🤭','🤫','🤥',
      '😶','😐','😑','😬','🙄','😯','😦','😧',
      '😮','😲','🥱','😴','🤤','😪','😵','🤐',
      '🥴','🤢','🤮','🤧','😷','🤒','🤕','👍',
      '👎','👌','✌️','🤞','🤟','🤘','🤙','👈',
      '👉','👆','👇','☝️','✋','🤚','🖐','🖖',
      '👋','🤝','🙏','💪','❤️','🧡','💛','💚',
      '💙','💜','🖤','🤍','💔','❣️','💕','💞',
      '💓','💗','💖','💘','💝','🎉','🎊','🎁'
    ];

    function buildEmojiPicker() {
      els.emojiPicker.innerHTML = '';
      EMOJIS.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = emoji;
        btn.addEventListener('click', () => {
          // Insert at cursor position in input
          const start = els.input.selectionStart ?? els.input.value.length;
          const end = els.input.selectionEnd ?? els.input.value.length;
          const before = els.input.value.substring(0, start);
          const after = els.input.value.substring(end);
          els.input.value = before + emoji + after;
          const newPos = start + emoji.length;
          els.input.setSelectionRange(newPos, newPos);
          els.input.focus();
        });
        els.emojiPicker.appendChild(btn);
      });
    }

    els.emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      els.attachMenu.classList.remove('open');
      els.emojiPicker.classList.toggle('open');
    });

    // =====================================================================
    // ATTACHMENT MENU
    // =====================================================================
    els.attachBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      els.emojiPicker.classList.remove('open');
      els.attachMenu.classList.toggle('open');
    });

    els.attachMenu.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        els.attachMenu.classList.remove('open');

        if (type === 'image' || type === 'document') {
          // Open a file picker
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = type === 'image' ? 'image/*' : '*/*';
          fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            // Send filename as a message (placeholder until upload endpoint exists)
            els.input.value = `📎 ${file.name}`;
            els.input.focus();
          });
          fileInput.click();
        } else if (type === 'location') {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              pos => {
                els.input.value = `📍 https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                els.input.focus();
              },
              () => {
                els.input.value = '📍 (Location unavailable)';
                els.input.focus();
              }
            );
          } else {
            els.input.value = '📍 (Geolocation not supported)';
            els.input.focus();
          }
        }
      });
    });

    // Close pickers when clicking elsewhere
    document.addEventListener('click', (e) => {
      if (!els.emojiPicker.contains(e.target) && e.target !== els.emojiBtn) {
        els.emojiPicker.classList.remove('open');
      }
      if (!els.attachMenu.contains(e.target) && e.target !== els.attachBtn) {
        els.attachMenu.classList.remove('open');
      }
    });

    // =====================================================================
    // EVENTS
    // =====================================================================
    els.sendBtn.addEventListener('click', sendMessage);
    els.input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    els.backBtn.addEventListener('click', () => {
      els.body.classList.remove('chat-active');
      els.body.classList.remove('mobile-chat-open');
      state.activeChatId = null;

      restartPolling(state.POLL_IDLE_MS);

      setTimeout(() => {
        els.activeView.style.display = 'none';
        els.placeholder.style.display = 'flex';
        renderList();
      }, 300);
    });

    els.search.addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      const items = els.list.querySelectorAll('.chat-item');
      items.forEach(item => {
        const name = item.querySelector('.chat-name').textContent.toLowerCase();
        item.style.display = name.includes(term) ? 'flex' : 'none';
      });
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (state.pollInterval) {
          clearInterval(state.pollInterval);
          state.pollInterval = null;
        }
      } else {
        const intervalMs = state.activeChatId ? state.POLL_ACTIVE_MS : state.POLL_IDLE_MS;
        restartPolling(intervalMs);
        poll();
      }
    });

    // =====================================================================
    // INIT
    // =====================================================================
    buildEmojiPicker();
    processData(window.rawMessages);
    renderList();
    restartPolling(state.POLL_IDLE_MS);
    poll();
  });
</script>
{% endblock %}

{% extends "base.html" %} {% block title %}Delete Account - HomeHub{% endblock %}
{% block content %}

<div class="container py-5" style="max-width: 900px;">
  <div class="card p-4">
    <h2>Delete Account</h2>
    <p class="text-danger">This action is permanent and cannot be undone.</p>

    <form id="deleteAccountForm" method="POST" action="{{ post_url }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ current_user.email }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password to confirm" required>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="confirmCheck">
        <label class="form-check-label" for="confirmCheck">I understand this will permanently delete my account.</label>
      </div>

      <div class="d-flex gap-2">
        <a href="{{ back_url }}" class="btn btn-outline-secondary">Cancel</a>
        <button id="deleteBtn" type="submit" class="btn btn-danger" disabled>Delete My Account</button>
      </div>
    </form>
  </div>
</div>

<script>
  const passwordInput = document.getElementById('password');
  const confirmCheck = document.getElementById('confirmCheck');
  const deleteBtn = document.getElementById('deleteBtn');

  function validate() {
    deleteBtn.disabled = !(passwordInput.value.trim() && confirmCheck.checked);
  }

  passwordInput.addEventListener('input', validate);
  confirmCheck.addEventListener('change', validate);

  // Leave form submission to server (POST) which will delete and redirect to sign-in
</script>

{% endblock %}

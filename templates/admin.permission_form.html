{% extends 'base.html' %}
{% block title %}{{ 'Edit Permission' if permission else 'Create Permission' }}{% endblock %}
{% block content %}
<div class="content-card">
  <div class="content-card-header">
    <h3 class="content-card-title">{{ 'Edit Permission' if permission else 'Create Permission' }}</h3>
  </div>
  <div class="content-card-body">
    <form method="POST" action="{% if permission %}{{ url_for('admin.edit_permission', perm_id=permission.id) }}{% else %}{{ url_for('admin.create_permission') }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ permission.name if permission else '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <input name="description" class="form-control" value="{{ permission.description if permission else '' }}">
      </div>
      <button class="btn btn-primary">Save</button>
      <a href="{{ url_for('admin.permissions') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

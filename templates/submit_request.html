{% extends 'base.html' %} {% block title %}Submit Maintenance Request{% endblock %} {% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
          <h2 class="mb-0">Submit Maintenance Request</h2>
        </div>

        <div class="card-body">
          <form method="POST">
            {{ csrf_token() }}
            <div class="mb-3">
              <label for="issueCategory" class="form-label">Issue Category</label>
              <select class="form-control" id="issueCategory" name="category" required>
                <option value="">-- Select Category --</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Electrical">Electrical</option>
                <option value="Structural">Structural</option>
                <option value="Heating/Cooling">Heating/Cooling</option>
                <option value="Appliances">Appliances</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="issue" class="form-label">Describe the Issue</label>
              <textarea
                class="form-control"
                id="issue"
                name="issue"
                rows="5"
                placeholder="Please describe the maintenance issue in detail..."
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label for="priority" class="form-label">Priority Level</label>
              <select class="form-control" id="priority" name="priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Emergency">Emergency</option>
              </select>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Submit Request</button>
              <a href="{{ url_for('tenant.dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
